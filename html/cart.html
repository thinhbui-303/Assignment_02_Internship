<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - SHOP.CO</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

  <app-header></app-header>

  <div class="container">
    <!-- BREADCRUMBS -->
    <div class="breadcrumbs" style="margin-bottom: 25px; margin-top: 10px;">
      <a href="../index.html">Home</a> &gt; <span style="color: black; font-weight: 500;">Cart</span>
    </div>

    <h1 class="cart-title">YOUR CART</h1>

    <div class="cart-container">
      <!-- CART ITEMS -->
      <div class="cart-items-wrapper">
        <!-- Item 1 -->
        <div class="cart-item">
          <div class="item-img">
            <img src="../Images/gradientgraphictshirt.png" alt="Gradient Graphic T-shirt">
          </div>
          <div class="item-details">
            <div class="item-title-row">
              <h3>Gradient Graphic T-shirt</h3>
              <button class="btn-delete"><img src="../Images/deleteicon.svg" alt="Delete"></button>
            </div>
            <div class="item-meta">
              <p>Size: <span>Large</span></p>
              <p>Color: <span>White</span></p>
            </div>
            <div class="item-price-row">
              <div class="item-price">$145</div>
              <div class="item-qty">
                <button>-</button>
                <span>1</span>
                <button>+</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="cart-item">
          <div class="item-img">
            <img src="../Images/checkershirt.png" alt="Checkered Shirt">
          </div>
          <div class="item-details">
            <div class="item-title-row">
              <h3>Checkered Shirt</h3>
              <button class="btn-delete"><img src="../Images/deleteicon.svg" alt="Delete"></button>
            </div>
            <div class="item-meta">
              <p>Size: <span>Medium</span></p>
              <p>Color: <span>Red</span></p>
            </div>
            <div class="item-price-row">
              <div class="item-price">$180</div>
              <div class="item-qty">
                <button>-</button>
                <span>1</span>
                <button>+</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Item 3 -->
        <div class="cart-item">
          <div class="item-img">
            <img src="../Images/skinnyfitjean.png" alt="Skinny Fit Jeans">
          </div>
          <div class="item-details">
            <div class="item-title-row">
              <h3>Skinny Fit Jeans</h3>
              <button class="btn-delete"><img src="../Images/deleteicon.svg" alt="Delete"></button>
            </div>
            <div class="item-meta">
              <p>Size: <span>Large</span></p>
              <p>Color: <span>Blue</span></p>
            </div>
            <div class="item-price-row">
              <div class="item-price">$240</div>
              <div class="item-qty">
                <button>-</button>
                <span>1</span>
                <button>+</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ORDER SUMMARY -->
      <div class="order-summary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span>$565</span>
        </div>
        <div class="summary-row discount">
          <span>Discount (-20%)</span>
          <span>-$113</span>
        </div>
        <div class="summary-row">
          <span>Delivery Fee</span>
          <span>$15</span>
        </div>
        
        <div class="summary-total">
          <span>Total</span>
          <span>$467</span>
        </div>

        <div class="promo-code">
          <div class="promo-input-wrapper">
            <img src="../Images/tagicon.svg" alt="Tag">
            <input type="text" placeholder="Add promo code">
          </div>
          <button>Apply</button>
        </div>

        <button class="btn-checkout">Go to Checkout &rarr;</button>
      </div>
    </div>
  </div>

  <app-footer></app-footer>

  <script src="../js/components.js"></script>
  <script src="../js/global.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
